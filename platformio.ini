[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
lib_deps =
    arduino-libraries/Servo

[env:testSensorGiro]
extends = env:megaatmega2560
lib_deps =
build_src_filter =
    -<*>
    +<../test/testSensorGiro.cpp>
    
[env:testMovimiento]

lib_deps = 
    adafruit/Adafruit TCS34725
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    arduino-libraries/Servo

[env:testColor]
extends = env:megaatmega2560
lib_deps =
build_src_filter =
    -<*>
    +<../test/testMovimiento.cpp>

[env:testUltrasonico]
extends = env:megaatmega2560
lib_deps =
build_src_filter =
    -<*>
    +<../test/testUltrasonico.cpp>

[env:testMovimientoUltra]
extends = env:megaatmega2560
lib_deps =
build_src_filter =
    -<*>
    +<../test/testMovimientoUltrasonico.cpp>
    +<../test/testColor.cpp>

[env:testServo]
extends = env:megaatmega2560
lib_deps =
    arduino-libraries/Servo
build_src_filter =
    -<*>
    +<../test/testServo.cpp>

