[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600

lib_deps = 
    arduino-libraries/Servo

[env:testColor]
extends = env:megaatmega2560
lib_deps =
build_src_filter =
    -<*>
    +<../test/testColor.cpp>

[env:testServo]
extends = env:megaatmega2560
lib_deps =
    arduino-libraries/Servo
build_src_filter =
    -<*>
    +<../test/testServo.cpp>

